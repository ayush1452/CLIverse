version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - prealloc
    - exhaustive
    - noctx
    - bodyclose

linters-settings:
  govet:
    enable-all: true
  goimports:
    local-prefixes: github.com/ayush1452/CLIverse

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, unparam]
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  modules-download-mode: readonly
